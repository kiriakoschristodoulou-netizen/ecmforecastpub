name: ecmforecast
description: "ECM Forecasting Alerts - countdown to forecasted geopolitical, economic, and social events."
publish_to: 'none'

# Version follows SemVer + Android versionCode after the +.
# Bump the part before + when shipping; bump the part after + on every Android build.
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # System integration
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.3

  # Date formatting (used for user-selectable date format setting)
  intl: ^0.19.0
  timezone: ^0.9.4

  # Identifiers (anonymous install UUID for telemetry)
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
