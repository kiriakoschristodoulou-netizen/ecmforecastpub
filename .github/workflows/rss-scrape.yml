name: RSS scrape

# Runs every 2 days at 00:00 UTC to fetch the latest Armstrong RSS posts
# and append them (with full bodies from WP REST) into
# backend/output/armstrong_raw_archive.json.
#
# Cumulative archive: existing posts are preserved; only previously-unseen
# wp_ids are added. Mojibake is fixed via ftfy before writing.
#
# The workflow commits the updated archive (and only the archive) back to
# main if anything new was appended. The synthesis pipeline workflow picks
# up these new posts on its own bi-weekly schedule.
#
# Loud failure: any unrecoverable error exits non-zero and GitHub emails
# the maintainer. Don't auto-retry.

on:
  schedule:
    # 00:07 UTC on days 1, 3, 5, ... of every month. Off the top of the
    # hour deliberately: GitHub drops/delays :00 scheduled runs under
    # load. cron has no true "every 2 days" syntax; this is close enough.
    - cron: "7 0 */2 * *"
  workflow_dispatch:  # allow manual triggering from Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the updated archive back
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend/scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS-to-archive
        working-directory: backend/scraper
        run: python rss_to_archive.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet backend/output/armstrong_raw_archive.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No archive changes; nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Archive changed; will commit."
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        env:
          # Push via an explicit token-authenticated URL rather than
          # relying on the credential persisted by actions/checkout.
          # The persisted-credential path started failing with
          # "could not read Username for https://github.com:
          # No such device or address" (exit 128) on 2026-05-20.
          # Constructing the remote URL from GITHUB_TOKEN is the robust
          # pattern that doesn't depend on the credential helper.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ecmforecast-bot"
          git config user.email "ecmforecast-bot@users.noreply.github.com"
          git add backend/output/armstrong_raw_archive.json
          git commit -m "Auto: RSS scrape appended new posts to archive"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
