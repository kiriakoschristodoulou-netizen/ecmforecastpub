name: Scheduled events scrape

# Runs monthly on the 1st at 03:00 UTC. Scrapes 5 free data sources for
# scheduled events:
#   - Fed FOMC (federalreserve.gov HTML scrape)
#   - Wikipedia electoral calendars (MediaWiki API)
#   - ECB monetary policy meetings (hardcoded, no scrape)
#   - OPEC meetings (hardcoded, no scrape)
#   - US Treasury 20Y/30Y bond auctions (fiscaldata.treasury.gov JSON API)
#
# Hardcoded sources (ECB, OPEC) need annual manual update - see comment
# at top of each scheduled_events_*.py file for update procedure.
#
# All sources are free. No paid services. No Apify dependency.
#
# Individual scrapers can fail soft (exit code 2 if zero events parsed,
# usually means page layout changed). The workflow continues and uses
# whatever sources did succeed. Hard fails (exit code 1, e.g. network
# outage) abort the workflow and email the maintainer.

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  scrape-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend/scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Fed FOMC
        working-directory: backend/scraper
        run: |
          python scheduled_events_fomc.py || code=$?
          if [ "${code:-0}" = "1" ]; then exit 1; fi

      - name: Scrape Wikipedia electoral calendars
        working-directory: backend/scraper
        run: |
          python scheduled_events_elections.py || code=$?
          if [ "${code:-0}" = "1" ]; then exit 1; fi

      - name: Build ECB schedule (hardcoded)
        working-directory: backend/scraper
        run: python scheduled_events_ecb.py

      - name: Build OPEC schedule (hardcoded)
        working-directory: backend/scraper
        run: python scheduled_events_opec.py

      - name: Scrape Treasury 20Y/30Y auctions
        working-directory: backend/scraper
        run: |
          python scheduled_events_treasury.py || code=$?
          if [ "${code:-0}" = "1" ]; then exit 1; fi

      - name: Merge feeders into scheduled_events.json
        working-directory: backend/scraper
        run: python scheduled_events_build.py

      - name: Rebuild events_public.json with attached related events
        working-directory: backend/scraper
        run: python build_public_feed.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet backend/output/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No output changes; nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Outputs changed; will commit."
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        env:
          # Explicit token-URL push (see rss-scrape.yml). The credential
          # persisted by actions/checkout started failing with exit 128
          # "could not read Username" on 2026-05-20. Building the remote
          # URL from GITHUB_TOKEN is the robust pattern.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ecmforecast-bot"
          git config user.email "ecmforecast-bot@users.noreply.github.com"
          git add backend/output/scheduled_events_fomc.json \
                  backend/output/scheduled_events_elections.json \
                  backend/output/scheduled_events_ecb.json \
                  backend/output/scheduled_events_opec.json \
                  backend/output/scheduled_events_treasury.json \
                  backend/output/scheduled_events.json \
                  backend/output/events_public.json
          git commit -m "Auto: scheduled events scrape + feed rebuild"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
